services:
  kubo:
    image: fiftysix/kubo:latest
    container_name: kubo
    command: ipfs daemon
    volumes:
      - ipfs-data:/node/ipfs
    # environment:
    #   # Where kubo binds the RPC API / gateway inside the container (applied on
    #   # every start). Defaults are shown.
    #   IPFS_API_ADDRESS: "/ip4/0.0.0.0/tcp/5001"
    #   IPFS_GATEWAY_ADDRESS: "/ip4/0.0.0.0/tcp/8080"
    ports:
      - "4001:4001"
      # The RPC API has admin-level access to the node: keep it (and the
      # gateway) on the host's loopback interface unless you have put
      # authentication or a firewall in front of them.
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:8080:8080"
    networks:
      - ipfs-net

networks:
  ipfs-net:
    driver: bridge

volumes:
  ipfs-data:
