[Eth]
NetworkId = 97

[Eth.Miner]
GasCeil = 35000000
GasPrice = 100000000

[Eth.TxPool]
Locals = []
NoLocals = true
Journal = "transactions.rlp"
Rejournal = 3600000000000
PriceLimit = 100000000
PriceBump = 10
AccountSlots = 16
GlobalSlots = 4096
AccountQueue = 64
GlobalQueue = 1024
Lifetime = 10800000000000

[Eth.GPO]
Blocks = 20
Percentile = 60
OracleThreshold = 1000

[Node]
DataDir = "/node/bsc/data"
IPCPath = "/node/bsc/data/geth.ipc"
InsecureUnlockAllowed = false
# Upstream's own published config.toml sets HTTPHost to "127.0.0.1", which
# only accepts connections from inside the container - overridden to 0.0.0.0
# here, same as every other client in this repo. Also normalized HTTPPort/
# WSPort from upstream's 8575/8576 to this repo's usual 8545/8546, so mainnet
# and testnet behave identically from the outside - only NetworkId, the
# genesis file, and the bootnodes below actually differ between them.
HTTPHost = "0.0.0.0"
HTTPPort = 8545
HTTPVirtualHosts = ["*"]
HTTPModules = ["debug", "eth", "net", "web3", "txpool", "parlia"]
WSHost = "0.0.0.0"
WSPort = 8546
WSModules = ["net", "web3", "eth"]

[Node.P2P]
MaxPeers = 50
NoDiscovery = false
TrustedNodes = []
# Upstream's own published bootnodes for Chapel testnet - public, not secrets.
StaticNodes = [
